[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "oos-solver"
version = "0.2.0"
description = "Native O_o finite element solver with NumPy result arrays"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["oor-reader>=0.2.0,<0.3", "numpy>=1.23"]

[tool.scikit-build]
minimum-version = "0.11"
wheel.packages = ["python/oos_solver"]
build-dir = "build/python/{wheel_tag}"
build.targets = ["_native"]

[tool.scikit-build.cmake.define]
OOS_BUILD_PYTHON = "ON"
OOS_BUILD_NATIVE_CHECKS = "OFF"

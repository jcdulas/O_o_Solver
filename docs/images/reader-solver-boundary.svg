<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title description">
<title id="title">Two modules, an explicit data boundary</title>
<desc id="description">JavaScript coordinates two independent WebAssembly memories. Reader query tables cross as byte packages. Solver results return as arrays and may be added to Reader result storage.</desc>
<rect width="100%" height="100%" rx="18" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#1c2e48">
<text x="36" y="40" font-size="13" font-weight="700" letter-spacing="1.5" fill="#52647e">DATA OWNERSHIP</text>
<text x="36" y="77" font-size="28" font-weight="700">Two modules, an explicit data boundary</text>
<rect x="30" y="120" width="415" height="560" rx="16" fill="#ffffff" stroke="#4366b3" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="50" y="150" font-size="17" font-weight="700" fill="#4366b3">Reader module</text>
<text x="50" y="174" font-size="15" fill="#52647e">Owns model parsing and result storage</text>
<rect x="675" y="120" width="415" height="560" rx="16" fill="#ffffff" stroke="#7951a8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="695" y="150" font-size="17" font-weight="700" fill="#7951a8">Solver module</text>
<text x="695" y="174" font-size="15" fill="#52647e">Owns finite element computations</text>
<path d="M420 260 H465" fill="none" stroke="#50627b" stroke-width="2.4" stroke-linejoin="round"/>
<polygon points="465,260 453,255 453,265" fill="#50627b"/>
<path d="M655 260 H700" fill="none" stroke="#50627b" stroke-width="2.4" stroke-linejoin="round"/>
<polygon points="700,260 688,255 688,265" fill="#50627b"/>
<path d="M882 325 V495" fill="none" stroke="#50627b" stroke-width="2.4" stroke-linejoin="round"/>
<polygon points="882,495 887,483 877,483" fill="#50627b"/>
<rect x="854.0" y="399" width="56" height="24" rx="5" fill="#f8fafc"/>
<text x="882" y="416" text-anchor="middle" font-size="15" fill="#43546d">solve</text>
<path d="M700 565 H655" fill="none" stroke="#50627b" stroke-width="2.4" stroke-linejoin="round"/>
<polygon points="655,565 667,570 667,560" fill="#50627b"/>
<path d="M465 565 H420" fill="none" stroke="#50627b" stroke-width="2.4" stroke-linejoin="round"/>
<polygon points="420,565 432,570 432,560" fill="#50627b"/>
<rect x="55" y="195" width="365" height="130" rx="12" fill="#edf3ff" stroke="#4366b3" stroke-width="1.5"/>
<rect x="56" y="209" width="4" height="102" rx="2" fill="#4366b3"/>
<text x="75" y="220" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4366b3">MEMORY A</text>
<text x="75" y="248" font-size="21" font-weight="700">O_o_Reader</text>
<text x="75" y="277" font-size="20" fill="#43546d">Read .oos records</text>
<text x="75" y="301" font-size="20" fill="#43546d">Build and query typed tables</text>
<rect x="465" y="205" width="190" height="110" rx="12" fill="#fff5df" stroke="#a56b18" stroke-width="1.5"/>
<rect x="466" y="219" width="4" height="82" rx="2" fill="#a56b18"/>
<text x="485" y="230" font-size="12" font-weight="700" letter-spacing="1.2" fill="#a56b18">JAVASCRIPT</text>
<text x="485" y="258" font-size="21" font-weight="700">Table package</text>
<text x="485" y="287" font-size="20" fill="#43546d">Uint8Array</text>
<rect x="700" y="195" width="365" height="130" rx="12" fill="#f3edfc" stroke="#7951a8" stroke-width="1.5"/>
<rect x="701" y="209" width="4" height="102" rx="2" fill="#7951a8"/>
<text x="720" y="220" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7951a8">MEMORY B</text>
<text x="720" y="248" font-size="21" font-weight="700">O_o_Solver</text>
<text x="720" y="277" font-size="20" fill="#43546d">Validate imported tables</text>
<text x="720" y="301" font-size="20" fill="#43546d">Build a model snapshot</text>
<rect x="55" y="495" width="365" height="140" rx="12" fill="#e9f6f2" stroke="#237d69" stroke-width="1.5"/>
<rect x="56" y="509" width="4" height="112" rx="2" fill="#237d69"/>
<text x="75" y="520" font-size="12" font-weight="700" letter-spacing="1.2" fill="#237d69">READER RESULT API</text>
<text x="75" y="548" font-size="21" font-weight="700">Results in memory</text>
<text x="75" y="577" font-size="20" fill="#43546d">Attach arrays to a model</text>
<text x="75" y="601" font-size="20" fill="#43546d">Query, archive or export</text>
<rect x="465" y="510" width="190" height="110" rx="12" fill="#fff5df" stroke="#a56b18" stroke-width="1.5"/>
<rect x="466" y="524" width="4" height="82" rx="2" fill="#a56b18"/>
<text x="485" y="535" font-size="12" font-weight="700" letter-spacing="1.2" fill="#a56b18">JAVASCRIPT</text>
<text x="485" y="563" font-size="21" font-weight="700">Result arrays</text>
<text x="485" y="592" font-size="20" fill="#43546d">IDs + values</text>
<rect x="700" y="495" width="365" height="140" rx="12" fill="#f3edfc" stroke="#7951a8" stroke-width="1.5"/>
<rect x="701" y="509" width="4" height="112" rx="2" fill="#7951a8"/>
<text x="720" y="520" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7951a8">SOLVER RUN API</text>
<text x="720" y="548" font-size="21" font-weight="700">Finite element analysis</text>
<text x="720" y="577" font-size="20" fill="#43546d">Statics, modes, buckling</text>
<text x="720" y="601" font-size="20" fill="#43546d">Recover requested outputs</text>
<text x="55" y="727" font-size="16" fill="#43546d">Data contract checked on import. Each module owns its memory.</text>
<text x="55" y="751" font-size="16" fill="#43546d">The modules exchange bytes and arrays; C++ pointers stay within their owning module.</text>
<text x="55" y="775" font-size="16" fill="#43546d">Adding result arrays to the reader is an explicit application step.</text>
</g>
</svg>

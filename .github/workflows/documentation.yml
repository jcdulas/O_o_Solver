name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'include/**'
      - 'wasm/js/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'include/**'
      - 'wasm/js/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: Build private HTML documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build HTML and check internal links
        run: |
          python -m sphinx -W --keep-going -b html -c docs -d build/docs/doctrees . build/docs/html
          python docs/check_html.py build/docs/html
      - name: Archive HTML documentation
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: O_o_Solver-documentation
          path: build/docs/html/
          if-no-files-found: error
          retention-days: 90
      - name: Add download instructions
        env:
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
        run: |
          echo '## Documentation' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the HTML site]($ARTIFACT_URL) (repository access required)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the archive and open index.html. For local search, serve it with python -m http.server 8000 --bind 127.0.0.1.' >> "$GITHUB_STEP_SUMMARY"

name: WebAssembly

# Builds the two WebAssembly packages (64-bit WebAssembly): the default one, single-threaded (preset wasm,
# build/wasm/dist), and the shared-memory one (preset wasm-threads, build/wasm-threads/dist, docs/threading.md). It runs
# the test suites on each and, on the main branch, publishes both as the release that follows the branch and as the
# release kept for their version. Packages whose suites fail are not published.
# The suites need the O_o_Model package, which this repository does not build: they take the one that repository
# publishes for its main branch.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'wasm/src/**'
      - 'wasm/js/**'
      - 'wasm/test/**'
      - 'wasm/CMakeLists.txt'
      - 'wasm/package.json'
      - 'CMakeLists.txt'
      - '!**/*.md'
      # A tag targeting older workflow files may require extra permissions. Supersede that build on main.
      - '.github/workflows/**'
      - '.github/scripts/fetch-reader-package.sh'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'wasm/src/**'
      - 'wasm/js/**'
      - 'wasm/test/**'
      - 'wasm/CMakeLists.txt'
      - 'wasm/package.json'
      - 'CMakeLists.txt'
      - '!**/*.md'
      - '.github/workflows/webassembly.yml'
      - '.github/scripts/fetch-reader-package.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webassembly-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version of the Emscripten SDK the package is built with.
  EMSCRIPTEN_VERSION: '6.0.13'
  # The Node.js that runs the suites: the module needs 64-bit WebAssembly.
  NODE_VERSION: '24'
  # The O_o_Model package the suites load: the release that follows the main branch of that repository.
  READER_REPOSITORY: ${{ github.repository_owner }}/O_o_Model
  READER_TAG: wasm-latest
  READER_ARCHIVE: O_o_Model-wasm.zip
  # The time limits of the fast suite are those of a developer's machine: a shared runner gets ten times each.
  OOS_TEST_TIME_FACTOR: '10'

jobs:
  package:
    name: Build the ${{ matrix.variant.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { preset: wasm, artifact: O_o_Solver-wasm, title: single-threaded package }
          - { preset: wasm-threads, artifact: O_o_Solver-wasm-threads, title: shared-memory package }
    env:
      PRESET: ${{ matrix.variant.preset }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Install the Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Build the package
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          if [ "$PRESET" = wasm ]; then
            emcmake cmake -S . -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DOOS_BUILD_WASM=ON \
              -DOOS_WARNINGS_AS_ERRORS=OFF
          else
            cmake --preset "$PRESET" -DOOS_WARNINGS_AS_ERRORS=OFF
          fi
          cmake --build "build/$PRESET" -j "$(nproc)"
      - name: Load the module
        # The module needs 64-bit WebAssembly: the Node.js of the SDK runs it. From a script file: the workers of the
        # shared-memory package start with the options of their parent, and refuse those of an inline script.
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          printf '%s\n' \
            "import { loadOosSolver } from './dist/index.js';" \
            "const solver = await loadOosSolver();" \
            "console.log('module loaded:', solver.constructor.name, JSON.stringify(solver.threading()));" \
            "process.exit(0);" > "build/$PRESET/load-check.mjs"
          "${EMSDK_NODE:-node}" "build/$PRESET/load-check.mjs"
      - name: Archive the package
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.variant.artifact }}
          path: build/${{ matrix.variant.preset }}/dist/
          if-no-files-found: error
          retention-days: 90
      - name: Add download instructions
        env:
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
        run: |
          echo '## WebAssembly package (${{ matrix.variant.title }})' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the package]($ARTIFACT_URL) built from commit \`$GITHUB_SHA\` with Emscripten $EMSCRIPTEN_VERSION." >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the archive and import index.js; the module needs a runtime with 64-bit WebAssembly (Node.js 24 or later).' >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Run the fast suite (${{ matrix.variant.title }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { preset: wasm, artifact: O_o_Solver-wasm, title: single-threaded package }
          - { preset: wasm-threads, artifact: O_o_Solver-wasm-threads, title: shared-memory package }
    env:
      OOS_SOLVER_DIST: build/${{ matrix.variant.preset }}/dist
      OOS_TEST_RESULTS: build/test-results-${{ matrix.variant.preset }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.variant.artifact }}
          path: build/${{ matrix.variant.preset }}/dist
      - name: Fetch the O_o_Model package
        run: bash .github/scripts/fetch-reader-package.sh
      - name: Run the input combination and derivative cases
        # Every case in its worker, with its watchdog; the timing report is written in build/test-results.
        run: node wasm/test/run.mjs
      - name: Run the numerical derivative and worker pool tests
        run: node --test --test-concurrency=1 wasm/test/numerical-derivatives.test.mjs wasm/test/worker-pool.test.mjs
      - name: Archive the timing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: O_o_Solver-test-timings-${{ matrix.variant.preset }}
          path: build/test-results-${{ matrix.variant.preset }}/
          if-no-files-found: ignore
          retention-days: 30

  validation:
    name: Run the validation suite (${{ matrix.variant.title }}, part ${{ matrix.part }} of 4)
    # The benchmarks of docs/testing.md, without a time limit per case. Its files are dealt to four runners by their
    # rank in the folder, so that a new file needs no edit here.
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
        variant:
          - { preset: wasm, artifact: O_o_Solver-wasm, title: single-threaded package }
          - { preset: wasm-threads, artifact: O_o_Solver-wasm-threads, title: shared-memory package }
    env:
      PART_COUNT: 4
      OOS_SOLVER_DIST: build/${{ matrix.variant.preset }}/dist
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.variant.artifact }}
          path: build/${{ matrix.variant.preset }}/dist
      - name: Fetch the O_o_Model package
        run: bash .github/scripts/fetch-reader-package.sh
      - name: Run the files of this part
        env:
          PART: ${{ matrix.part }}
        run: |
          mapfile -t files < <(ls wasm/test/validation/*.test.mjs |
            awk -v part="$PART" -v count="$PART_COUNT" '(NR - 1) % count == part - 1')
          echo "Files of part $PART: ${files[*]}"
          test "${#files[@]}" -gt 0
          node --test "${files[@]}"

  release:
    name: Publish the package as releases
    # Two kinds of release. One follows the main branch (wasm-latest, a pre-release): its tag moves to the commit built
    # and its archive is replaced. One is kept for each version of wasm/package.json (v0.2.1, ...): it is made by the
    # first build of that version and never changed afterwards, and the newest is the latest release of the repository.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [package, tests, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: webassembly-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_TAG: wasm-latest
      BRANCH_TITLE: WebAssembly packages of the main branch
      ARCHIVE: O_o_Solver-wasm.zip
      THREADED_ARCHIVE: O_o_Solver-wasm-threads.zip
    steps:
      - name: Fetch the single-threaded package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: O_o_Solver-wasm
          path: package
      - name: Fetch the shared-memory package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: O_o_Solver-wasm-threads
          path: package-threads
      - name: Make the archives and their notes
        run: |
          (cd package && zip --recurse-paths "../$ARCHIVE" .)
          (cd package-threads && zip --recurse-paths "../$THREADED_ARCHIVE" .)
          VERSION="$(jq --raw-output '.version // empty' package/package.json)"
          test -n "$VERSION"
          test "$VERSION" = "$(jq --raw-output '.version // empty' package-threads/package.json)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "Version $VERSION of the packages, built from commit $GITHUB_SHA with Emscripten $EMSCRIPTEN_VERSION:"
            echo
            echo "- $ARCHIVE: the default package, single-threaded;"
            echo "- $THREADED_ARCHIVE: the shared-memory package, whose analyses run on several threads (Web"
            echo "  Workers). In a browser, the page needs cross-origin isolation (docs/threading.md)."
            echo
            echo "Extract an archive and import index.js; the module needs a runtime with 64-bit WebAssembly"
            echo "(Node.js 24 or later, or a browser that supports it). The test suites of the repository passed on"
            echo "both packages, with the O_o_Model package of the main branch of its repository."
          } > notes.md
          {
            echo "The latest build of the main branch, replaced at every change of its sources."
            echo
            cat notes.md
          } > branch-notes.md
      - name: Publish the build of the main branch
        run: |
          if gh release view "$BRANCH_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$BRANCH_TAG" \
              --raw-field sha="$GITHUB_SHA" --field force=true > /dev/null
            gh release upload "$BRANCH_TAG" "$ARCHIVE" "$THREADED_ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$BRANCH_TAG" --title "$BRANCH_TITLE" --notes-file branch-notes.md --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$BRANCH_TAG" "$ARCHIVE" "$THREADED_ARCHIVE" --target "$GITHUB_SHA" \
              --title "$BRANCH_TITLE" \
              --notes-file branch-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          echo '## Releases' >> "$GITHUB_STEP_SUMMARY"
          for archive in "$ARCHIVE" "$THREADED_ARCHIVE"; do
            echo "[$archive of the main branch]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$BRANCH_TAG/$archive) is published." >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Keep the release of a new version
        run: |
          VERSION_TAG="v$VERSION"
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Version $VERSION has its release, kept as it is." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$VERSION_TAG" "$ARCHIVE" "$THREADED_ARCHIVE" --target "$GITHUB_SHA" \
              --title "Version $VERSION" \
              --notes-file notes.md --latest --repo "$GITHUB_REPOSITORY"
            for archive in "$ARCHIVE" "$THREADED_ARCHIVE"; do
              echo "[$archive of version $VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION_TAG/$archive) is published and kept." >> "$GITHUB_STEP_SUMMARY"
            done
          fi

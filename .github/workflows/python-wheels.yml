name: Python wheels
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: [cp310, cp311, cp312, cp313, cp314]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja
      - name: Configure the Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ucrt = $env:MSYS_ROOT.Replace('\', '/') + '/ucrt64'
          ('CIBW_ENVIRONMENT_WINDOWS=CMAKE_GENERATOR=Ninja CMAKE_ARGS="-DCMAKE_CXX_COMPILER={0}/bin/g++.exe -DCMAKE_C_COMPILER={0}/bin/gcc.exe -DCMAKE_PREFIX_PATH={0}" PATH="$PATH;{0}/bin"' -f $ucrt) >> $env:GITHUB_ENV
          ('CIBW_REPAIR_WHEEL_COMMAND_WINDOWS=delvewheel repair --add-path "' + $ucrt + '/bin" -w {dest_dir} {wheel}') >> $env:GITHUB_ENV
      - uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"
          CIBW_ARCHS: auto64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel
          CIBW_TEST_COMMAND: python "{project}/python/tests/smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz

  publish:
    if: inputs.publish
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
